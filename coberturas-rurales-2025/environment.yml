# Entorno con las versiones usadas en la ejecución entregada (junio de 2026).
# Probado en Ubuntu (WSL2) con GPU NVIDIA (CUDA 12.8). Crear con:
#   conda env create -f environment.yml
#   conda activate coberturas-2025
name: coberturas-2025
channels:
  - conda-forge
dependencies:
  - python=3.11
  - gdal=3.10.3
  - rasterio=1.4.3
  - geopandas=1.1.3
  - pyogrio=0.11.0
  - shapely=2.1.2
  - pyproj=3.7.2
  - numpy=2.4.3
  - pandas=3.0.2
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - scikit-image=0.26.0
  - pyyaml=6.0.3
  - joblib=1.5.3
  - pytest
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0
      - torchvision==0.26.0
      - transformers==5.6.2
      - huggingface_hub==1.12.0
      - safetensors==0.8.0
      - timm==1.0.26
      - opencv-python-headless==4.11.0
      # Etiquetas débiles (Google Earth Engine / Dynamic World)
      - earthengine-api==1.7.30
      - geedim==2.0.0
      # Módulos experimentales (SAM 2 y Clay + LoRA); no los usa el flujo final
      - segment-geospatial==1.3.2
      - sam2==1.1.0
      - terratorch==1.2.8
      - peft==0.19.1
